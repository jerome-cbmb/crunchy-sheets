<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #f8f9fa;
      padding: 16px;
    }

    .header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #dadce0;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
      color: #1a73e8;
    }

    .header .subtitle {
      font-size: 11px;
      color: #5f6368;
      margin-top: 4px;
    }

    .user-info {
      font-size: 11px;
      color: #5f6368;
      text-align: center;
      margin-bottom: 16px;
      padding: 8px;
      background: #e8f0fe;
      border-radius: 8px;
    }

    /* Chat area */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 240px);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .message {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 90%;
      word-wrap: break-word;
    }

    .message.user {
      background: #1a73e8;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: white;
      border: 1px solid #dadce0;
      border-bottom-left-radius: 4px;
    }

    .message.system {
      background: #fef7e0;
      border: 1px solid #fdd835;
      font-size: 11px;
      text-align: center;
      max-width: 100%;
    }

    /* ─── Actions Preview Panel ─────────────────────────────── */
    .actions-panel {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      max-width: 100%;
    }

    .actions-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #e8f0fe;
      font-weight: 500;
      color: #1a73e8;
      font-size: 12px;
    }

    .actions-header .count-badge {
      display: inline-block;
      background: #1a73e8;
      color: white;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .actions-list {
      max-height: 180px;
      overflow-y: auto;
      padding: 8px 0;
    }

    .actions-list .action-item {
      padding: 5px 14px;
      font-size: 11px;
      color: #3c4043;
      line-height: 1.4;
      border-bottom: 1px solid #f1f3f4;
    }

    .actions-list .action-item:last-child {
      border-bottom: none;
    }

    .action-type-tag {
      display: inline-block;
      background: #f1f3f4;
      color: #5f6368;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 500;
      margin-right: 4px;
      text-transform: uppercase;
    }

    .actions-buttons {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #dadce0;
    }

    .btn-apply {
      flex: 1;
      padding: 8px 16px;
      background: #1e8e3e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-apply:hover { background: #188038; }
    .btn-apply:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }

    .btn-cancel {
      padding: 8px 16px;
      background: white;
      color: #5f6368;
      border: 1px solid #dadce0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-cancel:hover { background: #f8f9fa; }

    /* ─── Parse Warnings ────────────────────────────────────── */
    .parse-warnings {
      background: #fff8e1;
      border: 1px solid #ffcc80;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 11px;
      color: #e65100;
      max-width: 100%;
    }

    .parse-warnings .warning-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .parse-warnings ul {
      margin: 0;
      padding-left: 16px;
    }

    /* ─── Results Summary ───────────────────────────────────── */
    .results-panel {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      max-width: 100%;
    }

    .results-panel .results-title {
      font-weight: 500;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .results-stat {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    .results-stat.applied { background: #e6f4ea; color: #1e8e3e; }
    .results-stat.skipped { background: #fef7e0; color: #e37400; }
    .results-stat.errors  { background: #fce8e6; color: #d93025; }

    .results-errors {
      margin-top: 8px;
      font-size: 11px;
      color: #d93025;
    }

    .results-errors ul {
      margin: 4px 0 0 16px;
      padding: 0;
    }

    /* Input area */
    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #dadce0;
    }

    .input-area textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
    }

    .input-area textarea:focus {
      border-color: #1a73e8;
    }

    .input-area button {
      padding: 10px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .input-area button:hover { background: #1557b0; }
    .input-area button:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }

    /* Skill selector */
    .skill-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0;
      margin-bottom: 8px;
    }

    .skill-chip {
      display: inline-block;
      padding: 4px 10px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 16px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      color: #5f6368;
      transition: all 0.15s;
    }

    .skill-chip:hover { border-color: #1a73e8; color: #1a73e8; }
    .skill-chip.active {
      background: #e8f0fe;
      border-color: #1a73e8;
      color: #1a73e8;
    }

    .loading { opacity: 0.6; pointer-events: none; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #dadce0;
      border-top: 2px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    .spinner.green {
      border-top-color: #1e8e3e;
    }

    /* ─── Header flex row + expand button ────────────────── */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .expand-btn {
      background: none;
      border: 1px solid #dadce0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 8px;
      color: #5f6368;
      transition: all 0.15s;
      line-height: 1;
    }

    .expand-btn:hover {
      border-color: #1a73e8;
      color: #1a73e8;
    }

    /* ─── Markdown rendering in assistant messages ────────── */
    .message.assistant p { margin: 4px 0; }
    .message.assistant h3 { font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
    .message.assistant ul, .message.assistant ol { margin: 4px 0; padding-left: 18px; }
    .message.assistant li { margin: 2px 0; }
    .message.assistant strong { font-weight: 600; }
    .message.assistant em { font-style: italic; }

    .message.assistant code {
      background: #f1f3f4;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
    }

    .cell-ref {
      background: #e8f0fe;
      color: #1a73e8;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .cell-ref:hover { text-decoration: underline; }

    /* ─── Onboarding card ────────────────────────────────── */
    .onboarding-card {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .onboarding-title {
      font-weight: 500;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .role-option {
      display: block;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.4;
    }

    .role-option:hover { background: #f8f9fa; }
    .role-option input { margin-right: 8px; }

    .onboarding-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .onboarding-btn:hover { background: #1557b0; }

    /* ─── Formula X-Ray Card ──────────────────────────────── */
    .xray-card {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      max-width: 100%;
    }

    .xray-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #e8f0fe;
      font-size: 12px;
      font-weight: 500;
      color: #1a73e8;
    }

    .xray-cell-badge {
      display: inline-block;
      background: #1e8e3e;
      color: white;
      border-radius: 6px;
      padding: 2px 8px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      font-weight: 600;
    }

    .xray-computed {
      color: #3c4043;
      font-size: 12px;
      font-weight: 400;
    }

    .xray-formula-bar {
      background: #202124;
      color: #e8eaed;
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      padding: 10px 14px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .xray-section {
      padding: 10px 14px;
      border-top: 1px solid #f1f3f4;
    }

    .xray-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .xray-component {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f1f3f4;
      font-size: 12px;
    }

    .xray-component:last-child { border-bottom: none; }

    .xray-role-tag {
      display: inline-block;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .xray-role-tag.logic         { background: #fce8e6; color: #d93025; }
    .xray-role-tag.math          { background: #e8f0fe; color: #1a73e8; }
    .xray-role-tag.crossref      { background: #e6f4ea; color: #1e8e3e; }
    .xray-role-tag.lookup        { background: #f3e8fd; color: #8430ce; }
    .xray-role-tag.aggregation   { background: #fef7e0; color: #e37400; }
    .xray-role-tag.text          { background: #e8eaed; color: #3c4043; }
    .xray-role-tag.date          { background: #e0f7fa; color: #00796b; }
    .xray-role-tag.error_handling { background: #fce8e6; color: #c5221f; }

    .xray-fragment {
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      color: #202124;
      word-break: break-all;
    }

    .xray-explanation {
      color: #5f6368;
      font-size: 11px;
      line-height: 1.4;
    }

    .xray-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 11px;
      border-bottom: 1px solid #f1f3f4;
    }

    .xray-input-row:last-child { border-bottom: none; }

    .xray-input-cell {
      font-family: 'Roboto Mono', monospace;
      font-weight: 500;
      white-space: nowrap;
    }

    .xray-input-cell.crossref { color: #1e8e3e; }
    .xray-input-cell.local    { color: #1a73e8; }

    .xray-input-label {
      color: #5f6368;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .xray-input-value {
      color: #3c4043;
      font-family: 'Roboto Mono', monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .xray-tip {
      background: #fef7e0;
      border-top: 1px solid #fdd835;
      padding: 8px 14px;
      font-size: 11px;
      color: #e37400;
      line-height: 1.4;
    }

    .xray-summary {
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #3c4043;
    }

    /* ─── Streaming indicator ──────────────────────────────── */
    .message.assistant.streaming::after {
      content: '▊';
      animation: blink 0.7s infinite;
      color: #1a73e8;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Streaming indicators ────────────────────────────── */
    .json-building {
      color: #1a73e8; font-size: 11px; margin-top: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .spinner.small { width: 12px; height: 12px; border-width: 1.5px; }
    .stream-placeholder { color: #9aa0a6; font-size: 12px; font-style: italic; }

    /* ─── Action type color tags ──────────────────────────── */
    .tag-set_formula { background: #e6f4ea; color: #137333; }
    .tag-format_cell { background: #e8f0fe; color: #1a73e8; }
    .tag-set_value { background: #fef7e0; color: #b06000; }
    .tag-format_range { background: #e8f0fe; color: #1a73e8; }
    .tag-set_border { background: #f3e8fd; color: #7b1fa2; }
    .tag-auto_resize_columns { background: #e6f4ea; color: #137333; }
    .tag-delete_sheet { background: #fce8e6; color: #c5221f; }
    .tag-set_tab_color { background: #fef7e0; color: #b06000; }
    .tag-add_note { background: #e8f0fe; color: #1a73e8; }
    .tag-move_sheet { background: #f3e8fd; color: #7b1fa2; }

    /* ─── Skip reasons in results ─────────────────────────── */
    .skip-reason { padding: 4px 14px; font-size: 11px; color: #b06000; }

    /* ─── Prove It chip accent ────────────────────────────── */
    .skill-chip-prove { border-color: #1e8e3e; color: #1e8e3e; }
    .skill-chip-prove:hover { border-color: #137333; color: #137333; }
    .skill-chip-prove.active { background: #e6f4ea; border-color: #1e8e3e; color: #1e8e3e; }

    /* ─── Proof link ──────────────────────────────────────── */
    .proof-link {
      padding: 8px 14px; color: #1e8e3e; font-size: 12px;
      font-weight: 500; cursor: pointer; border-top: 1px solid #e8eaed;
    }
    .proof-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-row">
      <h1>🥜 Crunchy Sheets</h1>
      <button class="expand-btn" onclick="toggleView()" title="Open in window">↗</button>
    </div>
    <div class="subtitle">AI CFO for Google Sheets</div>
  </div>

  <div class="user-info" id="userInfo">Connecting...</div>

  <!-- Onboarding -->
  <div class="onboarding-card" id="onboardingCard" style="display:none;">
    <div class="onboarding-title">What's your relationship to this workbook?</div>
    <label class="role-option"><input type="radio" name="userRole" value="builder"> <strong>Builder</strong> — I created or maintain this model</label>
    <label class="role-option"><input type="radio" name="userRole" value="reviewer"> <strong>Reviewer</strong> — I'm reviewing or auditing this</label>
    <label class="role-option"><input type="radio" name="userRole" value="inherited"> <strong>Inherited</strong> — I took over someone else's model</label>
    <label class="role-option"><input type="radio" name="userRole" value="exploring"> <strong>Exploring</strong> — Just looking around</label>
    <button class="onboarding-btn" onclick="completeOnboarding()">Start</button>
  </div>

  <!-- Skill chips -->
  <div class="skill-bar" id="skillBar"></div>

  <!-- Chat -->
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message system">
        Ask me anything about your workbook — or pick a skill above.
      </div>
    </div>

    <div class="input-area">
      <textarea id="prompt" rows="2" placeholder="What would you like to analyze?" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    // ─── Configuration ─────────────────────────────────────────────────
    // TODO: Set to production domain (e.g., https://api.crunchy.tools)
    var VERCEL_API_BASE = 'https://crunchy-sheets.vercel.app';

    // ─── State ──────────────────────────────────────────────────────────
    var selectedSkill = null;
    var pendingActions = null; // Actions awaiting user confirmation
    var isDialogMode = (typeof isDialogMode !== 'undefined' && isDialogMode);

    // ─── Init ───────────────────────────────────────────────────────────
    (function init() {
      // Dialog mode: change expand button to back arrow
      if (isDialogMode) {
        var btn = document.querySelector('.expand-btn');
        if (btn) { btn.textContent = '←'; btn.title = 'Back to sidebar'; }
      }

      // Load user info
      google.script.run
        .withSuccessHandler(function(status) {
          var el = document.getElementById('userInfo');
          if (status && status.authorized) {
            el.textContent = '✓ Signed in as ' + status.email;
          } else {
            el.textContent = '⚠ Not authorized — please re-open the add-on.';
          }
        })
        .withFailureHandler(function() {
          document.getElementById('userInfo').textContent = '⚠ Could not check auth status.';
        })
        .checkAuthStatus();

      // Load skill chips
      google.script.run
        .withSuccessHandler(function(skills) {
          var bar = document.getElementById('skillBar');
          skills.forEach(function(skill) {
            var chip = document.createElement('div');
            chip.className = 'skill-chip';
            if (skill.id === 'prove_it') chip.classList.add('skill-chip-prove');
            chip.textContent = skill.name;
            chip.dataset.id = skill.id;
            chip.onclick = function() {
              document.querySelectorAll('.skill-chip').forEach(function(c) { c.classList.remove('active'); });
              if (selectedSkill === skill.id) {
                selectedSkill = null;
              } else {
                chip.classList.add('active');
                selectedSkill = skill.id;
              }
            };
            bar.appendChild(chip);
          });
        })
        .getSkillRegistry();

      // Check if onboarding is needed
      checkOnboarding();

      // Restore chat state if returning from expanded view
      restoreChatState();
    })();

    // ─── Chat ───────────────────────────────────────────────────────────
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    function send() {
      var input = document.getElementById('prompt');
      var text = input.value.trim();
      if (!text) return;

      // /prove slash command
      var proveSlashMatch = text.match(/^\/prove\s+(.*)/i);
      if (proveSlashMatch) {
        selectedSkill = 'prove_it';
        text = proveSlashMatch[1];
        document.querySelectorAll('.skill-chip').forEach(function(c) {
          c.classList.toggle('active', c.dataset.id === 'prove_it');
        });
      }

      // /xray shortcut
      var xrayMatch = text.match(/^\/xray\s*(.*)/i);
      if (xrayMatch) {
        var cellRef = xrayMatch[1].trim();
        text = cellRef ? 'Explain the formula in ' + cellRef : 'Explain the most complex formula';
        selectedSkill = 'formula_xray';
        document.querySelectorAll('.skill-chip').forEach(function(c) {
          c.classList.toggle('active', c.dataset.id === 'formula_xray');
        });
      }

      // /format shortcut
      var formatMatch = text.match(/^\/format\s*(.*)/i);
      if (formatMatch) {
        var instruction = formatMatch[1].trim();
        text = instruction
          ? 'Format this workbook: ' + instruction
          : 'Run a full housekeeping sweep on this workbook';
        selectedSkill = 'workbook_format';
        document.querySelectorAll('.skill-chip').forEach(function(c) {
          c.classList.toggle('active', c.dataset.id === 'workbook_format');
        });
      }

      // /audit shortcut
      var auditMatch = text.match(/^\/audit\s*(.*)/i);
      if (auditMatch) {
        var auditInstruction = auditMatch[1].trim();
        text = auditInstruction
          ? 'Audit tabs: ' + auditInstruction
          : 'Run a full tab audit on this workbook';
        selectedSkill = 'tab_audit';
        document.querySelectorAll('.skill-chip').forEach(function(c) {
          c.classList.toggle('active', c.dataset.id === 'tab_audit');
        });
      }

      addMessage(text, 'user');
      input.value = '';
      setLoading(true);

      // Prepend skill hint if selected (prove_it doesn't need prefix — it's sent in body)
      var fullPrompt = text;
      if (selectedSkill && selectedSkill !== 'prove_it') {
        fullPrompt = '[skill:' + selectedSkill + '] ' + text;
      }

      // "Prove It" context injection
      var proveItRegex = /prove\s+it|show\s+(me\s+)?your\s+work|back\s+it\s+up|prove\s+(that|this|the\s+numbers)/i;
      var isProveIt = selectedSkill === 'prove_it' || proveItRegex.test(text);
      if (isProveIt) {
        var lastAssistantText = getLastAssistantText();
        if (lastAssistantText) {
          fullPrompt = '[Previous AI Response]\n' + lastAssistantText
            + '\n[/Previous AI Response]\n\n' + fullPrompt;
        } else if (!selectedSkill) {
          // No previous message + keyword auto-detect (not explicit chip)
          // Short-circuit: show local message, don't hit API at all
          setLoading(false);
          addMessage('Nothing to verify yet — ask a question first, then say "prove it" to see the math.', 'assistant');
          return;
        }
        // Explicit chip with no context: let it through — Claude will respond with the same message server-side
      }

      // Step 1: Get payload from Apps Script (workbook state + auth token)
      google.script.run
        .withSuccessHandler(function(payload) {
          streamAnalysis(payload);
        })
        .withFailureHandler(function(err) {
          setLoading(false);
          addMessage('⚠ Error preparing request: ' + err.message, 'system');
        })
        .getAnalyzePayload(fullPrompt, null, selectedSkill || null);
    }

    // ─── Streaming ───────────────────────────────────────────────────────

    /**
     * Create a message div for progressive streaming rendering.
     */
    function createStreamingMessage() {
      var container = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message assistant streaming';
      div.innerHTML = '';
      container.appendChild(div);
      scrollToBottom();
      return div;
    }

    /**
     * Update a streaming message div with accumulated text (progressive markdown).
     */
    function updateStreamingMessage(div, text) {
      // Strip completed JSON code blocks from display during streaming
      var displayText = text.replace(/```json[\s\S]*?```/g, '').trim();
      // Detect open JSON fence with no closing fence → show building indicator
      var hasOpenJson = /```json/.test(text) && !(/```json[\s\S]*?```/).test(text);
      if (hasOpenJson) {
        var indicator = '<div class="json-building"><span class="spinner small"></span> Building changes...</div>';
        div.innerHTML = (displayText ? renderMarkdown(escapeHtml(displayText)) : '') + indicator;
      } else if (displayText) {
        div.innerHTML = renderMarkdown(escapeHtml(displayText));
      }
    }

    /**
     * Remove the streaming class and finalize the message.
     */
    function removeStreamingIndicator(div) {
      div.classList.remove('streaming');
    }

    /**
     * Stream analysis from Vercel endpoint.
     * Uses fetch() + ReadableStream for progressive rendering.
     */
    async function streamAnalysis(payload) {
      if (!payload) {
        setLoading(false);
        addMessage('⚠ Could not read workbook. Try closing and re-opening the sidebar.', 'system');
        return;
      }
      var msgDiv = createStreamingMessage();
      msgDiv.innerHTML = '<span class="stream-placeholder">Reading your spreadsheet...</span>';

      try {
        var response = await fetch(VERCEL_API_BASE + '/api/analyze', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + payload.token
          },
          body: JSON.stringify({
            workbookState: payload.workbookState,
            prompt: payload.prompt,
            spreadsheetId: payload.spreadsheetId,
            userEmail: payload.userEmail,
            userRole: payload.userRole,
            skill: selectedSkill || undefined,
            crossRefGraph: payload.crossRefGraph || undefined
          })
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error(response.status + ': ' + errText);
        }

        var reader = response.body.getReader();
        var decoder = new TextDecoder();
        var accumulated = '';

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          accumulated += decoder.decode(chunk.value, { stream: true });
          updateStreamingMessage(msgDiv, accumulated);
          scrollToBottom();
        }

        // Stream complete
        setLoading(false);
        removeStreamingIndicator(msgDiv);
        finalizeStreamedMessage(msgDiv, accumulated);

      } catch (err) {
        setLoading(false);
        removeStreamingIndicator(msgDiv);
        if (msgDiv.parentNode) msgDiv.remove();
        addMessage('⚠ Error: ' + err.message, 'system');
      }
    }

    /**
     * Parse the completed streamed response for actions/xray.
     */
    function finalizeStreamedMessage(msgDiv, fullText) {
      // Store raw text for Prove It context injection
      msgDiv.dataset.rawText = fullText;

      var parsed = parseStreamedResponse(fullText);

      // Formula X-Ray — replace streaming div with xray card
      if (parsed.formulaXray) {
        msgDiv.remove();
        renderFormulaXray(parsed.formulaXray);
        return;
      }

      // Replace raw stream with clean response text
      msgDiv.innerHTML = renderMarkdown(escapeHtml(parsed.response));

      // Parse warnings
      if (parsed.parseErrors && parsed.parseErrors.length > 0) {
        addParseWarnings(parsed.parseErrors);
      }

      // Actions panel
      if (parsed.actions && parsed.actions.length > 0) {
        pendingActions = parsed.actions;
        addActionsPanel(parsed.actions);
      }
    }

    /**
     * Client-side response parser (mirrors action-parser.ts logic).
     * Extracts JSON from the streamed text and validates actions.
     */
    function parseStreamedResponse(claudeText) {
      var parseErrors = [];

      // Try to find a JSON code block
      var jsonMatch = claudeText.match(/```(?:json)?\s*([\s\S]*?)```/);
      var jsonText = null;

      if (jsonMatch) {
        jsonText = jsonMatch[1].trim();
      } else {
        var trimmed = claudeText.trim();
        if (trimmed.charAt(0) === '{' && trimmed.charAt(trimmed.length - 1) === '}') {
          jsonText = trimmed;
        }
      }

      var parsedJson = null;
      if (jsonText) {
        try {
          parsedJson = JSON.parse(jsonText);
        } catch (e) {
          parseErrors.push('Failed to parse JSON: ' + e);
        }
      }

      // Formula X-Ray passthrough
      if (parsedJson && parsedJson.type === 'formula_xray') {
        return {
          actions: [],
          response: parsedJson.summary || '',
          formulaXray: parsedJson
        };
      }

      var actions = [];
      var response = claudeText;
      var summary = undefined;

      if (parsedJson) {
        // Validate actions
        if (Array.isArray(parsedJson.actions)) {
          parsedJson.actions.forEach(function(action) {
            var v = validateActionClient(action);
            if (v.valid) {
              actions.push(action);
            } else {
              parseErrors.push(v.error);
            }
          });
        }

        if (typeof parsedJson.response === 'string') {
          response = parsedJson.response;
        }

        if (typeof parsedJson.summary === 'string') {
          summary = parsedJson.summary;
        }
      }

      return {
        actions: actions,
        response: response,
        summary: summary,
        parseErrors: parseErrors.length > 0 ? parseErrors : undefined,
        formulaXray: undefined
      };
    }

    /**
     * Client-side action validation (mirrors validateAction in action-parser.ts).
     */
    function validateActionClient(action) {
      if (!action || typeof action !== 'object') {
        return { valid: false, error: 'Action is not an object' };
      }

      var type = action.type;
      var validTypes = ['set_value', 'set_formula', 'format_cell', 'add_sheet', 'rename_sheet', 'add_named_range', 'activate_sheet', 'set_column_width', 'freeze_rows', 'format_range', 'set_border', 'auto_resize_columns', 'delete_sheet', 'set_tab_color', 'add_note', 'move_sheet'];
      if (!type || validTypes.indexOf(type) === -1) {
        return { valid: false, error: 'Invalid action type: ' + type };
      }

      switch (type) {
        case 'set_value':
        case 'set_formula':
          if (!action.sheet || !action.cell) {
            return { valid: false, error: type + ' requires sheet and cell' };
          }
          if (type === 'set_formula' && !action.formula) {
            return { valid: false, error: 'set_formula requires formula field' };
          }
          if (type === 'set_value' && action.value === undefined) {
            return { valid: false, error: 'set_value requires value field' };
          }
          break;
        case 'format_cell':
          if (!action.sheet || !action.cell) {
            return { valid: false, error: 'format_cell requires sheet and cell' };
          }
          if (!action.format || typeof action.format !== 'object') {
            return { valid: false, error: 'format_cell requires format object' };
          }
          break;
        case 'add_sheet':
          if (!action.sheetName) {
            return { valid: false, error: 'add_sheet requires sheetName' };
          }
          break;
        case 'rename_sheet':
          if (!action.sheet || !action.sheetName) {
            return { valid: false, error: 'rename_sheet requires sheet and sheetName' };
          }
          break;
        case 'add_named_range':
          if (!action.rangeName || !action.rangeA1) {
            return { valid: false, error: 'add_named_range requires rangeName and rangeA1' };
          }
          break;
        case 'activate_sheet':
          if (!action.sheet) {
            return { valid: false, error: 'activate_sheet requires sheet' };
          }
          break;
        case 'set_column_width':
          if (!action.sheet || !action.column || !action.width) {
            return { valid: false, error: 'set_column_width requires sheet, column, and width' };
          }
          break;
        case 'freeze_rows':
          if (!action.sheet || !action.rows) {
            return { valid: false, error: 'freeze_rows requires sheet and rows' };
          }
          break;
      }

      return { valid: true };
    }

    /**
     * Handle the result from analyzeWorkbook.
     * Shows the AI response, parse warnings, and action preview panel.
     */
    function handleAnalyzeResult(result) {
      setLoading(false);

      if (!result) {
        addMessage('No response received.', 'system');
        return;
      }

      if (result.error) {
        addMessage('⚠ ' + result.error, 'system');
        return;
      }

      // Formula X-Ray: render rich card instead of normal flow
      if (result.formulaXray) {
        renderFormulaXray(result.formulaXray);
        return;
      }

      // Show the AI's text response
      if (result.response) {
        addMessage(result.response, 'assistant');
      }

      // Show parse warnings if any
      if (result.parseErrors && result.parseErrors.length > 0) {
        addParseWarnings(result.parseErrors);
      }

      // Show action preview panel if actions exist
      if (result.actions && result.actions.length > 0) {
        pendingActions = result.actions;
        addActionsPanel(result.actions);
      }
    }

    // ─── Markdown Rendering ─────────────────────────────────────────────

    /**
     * Convert markdown-ish text to HTML for assistant messages.
     * Input must already be HTML-escaped.
     */
    function renderMarkdown(text) {
      var lines = text.split('\n');
      var html = '';
      var inList = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        // Headers: ### Header
        if (/^### (.+)/.test(line)) {
          if (inList) { html += '</ul>'; inList = false; }
          html += '<h3>' + applyInline(line.replace(/^### /, '')) + '</h3>';
          continue;
        }

        // Bullet list: - item or * item
        if (/^[\-\*] (.+)/.test(line)) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += '<li>' + applyInline(line.replace(/^[\-\*] /, '')) + '</li>';
          continue;
        }

        // Close list if we're no longer in one
        if (inList) { html += '</ul>'; inList = false; }

        // Empty line
        if (line.trim() === '') {
          html += '<br>';
          continue;
        }

        // Regular paragraph
        html += '<p>' + applyInline(line) + '</p>';
      }

      if (inList) { html += '</ul>'; }
      return html;
    }

    /**
     * Apply inline markdown: bold, italic, code, cell references.
     */
    function applyInline(text) {
      // Bold: **text**
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // Italic: *text* (but not inside bold)
      text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // Inline code: `text`
      text = text.replace(/`(.+?)`/g, '<code>$1</code>');
      // Cell references: Sheet!A1:B2 or 'Sheet Name'!A1:B2 or A1:B2 or A1 — make clickable
      text = text.replace(
        /\b((?:[A-Za-z0-9_ ]+|'[^']+')!)?([A-Z]{1,3}[0-9]+(?::[A-Z]{1,3}[0-9]+)?)\b/g,
        function(match, sheetPart, cellPart) {
          var sheet = sheetPart ? sheetPart.replace(/[!']/g, '').trim() : '';
          return '<span class="cell-ref" data-sheet="' + sheet + '" data-cell="' + cellPart + '" onclick="navigateToCellRef(this)">' + match + '</span>';
        }
      );
      return text;
    }

    // ─── Message Rendering ──────────────────────────────────────────────

    function addMessage(text, role) {
      var container = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message ' + role;
      if (role === 'assistant') {
        div.innerHTML = renderMarkdown(escapeHtml(text));
      } else {
        div.textContent = text;
      }
      container.appendChild(div);
      scrollToBottom();
    }

    /**
     * Render parse warnings from the backend.
     */
    function addParseWarnings(warnings) {
      var container = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'parse-warnings';

      var title = document.createElement('div');
      title.className = 'warning-title';
      title.textContent = '⚠ Parse warnings (' + warnings.length + ')';
      div.appendChild(title);

      var ul = document.createElement('ul');
      warnings.forEach(function(w) {
        var li = document.createElement('li');
        li.textContent = w;
        ul.appendChild(li);
      });
      div.appendChild(ul);

      container.appendChild(div);
      scrollToBottom();
    }

    /**
     * Render the actions preview panel with Apply/Cancel buttons.
     */
    function addActionsPanel(actions) {
      var container = document.getElementById('messages');
      var panel = document.createElement('div');
      panel.className = 'actions-panel';
      panel.id = 'actionsPanelActive';

      // Header
      var header = document.createElement('div');
      header.className = 'actions-header';
      header.innerHTML = '🔧 Claude wants to make <span class="count-badge">' + actions.length + '</span> change' + (actions.length !== 1 ? 's' : '');
      panel.appendChild(header);

      // Action list (get descriptions from server, or build locally)
      var list = document.createElement('div');
      list.className = 'actions-list';

      // Expand panel for Prove It proof sheets
      var isProofAction = actions.some(function(a) {
        return a.type === 'add_sheet' && a.sheetName && a.sheetName.indexOf('Proof: ') === 0;
      });
      list.style.maxHeight = isProofAction ? '300px' : '180px';

      actions.forEach(function(action) {
        var item = document.createElement('div');
        item.className = 'action-item';
        item.innerHTML = '<span class="action-type-tag tag-' + (action.type || 'default') + '">'
          + escapeHtml(formatActionType(action.type)) + '</span> '
          + escapeHtml(describeActionLocally(action));
        list.appendChild(item);
      });

      panel.appendChild(list);

      // Buttons
      var btnRow = document.createElement('div');
      btnRow.className = 'actions-buttons';

      var applyBtn = document.createElement('button');
      applyBtn.className = 'btn-apply';
      applyBtn.id = 'applyBtn';
      applyBtn.textContent = 'Apply All';
      applyBtn.onclick = function() { applyAllActions(); };

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = function() { cancelActions(panel); };

      btnRow.appendChild(applyBtn);
      btnRow.appendChild(cancelBtn);
      panel.appendChild(btnRow);

      container.appendChild(panel);
      scrollToBottom();
    }

    // ─── Action Execution ───────────────────────────────────────────────

    /**
     * Apply all pending actions via google.script.run.applyActions().
     */
    function applyAllActions() {
      if (!pendingActions || pendingActions.length === 0) return;

      var applyBtn = document.getElementById('applyBtn');
      if (applyBtn) {
        applyBtn.disabled = true;
        applyBtn.innerHTML = '<span class="spinner green"></span>Applying...';
      }

      var actionsToApply = pendingActions;
      var lastAppliedActions = pendingActions;
      pendingActions = null;

      google.script.run
        .withSuccessHandler(function(result) {
          // Remove the active panel
          var panel = document.getElementById('actionsPanelActive');
          if (panel) panel.remove();

          // Show results (pass applied actions for proof link)
          addResultsPanel(result, lastAppliedActions);
        })
        .withFailureHandler(function(err) {
          var panel = document.getElementById('actionsPanelActive');
          if (panel) panel.remove();

          addMessage('⚠ Error applying actions: ' + err.message, 'system');
        })
        .applyActions(actionsToApply);
    }

    /**
     * Cancel pending actions — remove the panel and discard.
     */
    function cancelActions(panel) {
      pendingActions = null;
      if (panel) panel.remove();
      addMessage('Changes cancelled.', 'system');
    }

    /**
     * Render the results panel after actions are applied.
     */
    function addResultsPanel(result, appliedActions) {
      var container = document.getElementById('messages');
      var panel = document.createElement('div');
      panel.className = 'results-panel';

      var title = document.createElement('div');
      title.className = 'results-title';
      title.textContent = '✅ Changes Applied';
      panel.appendChild(title);

      var stats = document.createElement('div');

      if (result.applied > 0) {
        stats.innerHTML += '<span class="results-stat applied">✓ ' + result.applied + ' applied</span>';
      }
      if (result.skipped > 0) {
        stats.innerHTML += '<span class="results-stat skipped">⊘ ' + result.skipped + ' skipped</span>';
      }
      if (result.errors && result.errors.length > 0) {
        stats.innerHTML += '<span class="results-stat errors">✗ ' + result.errors.length + ' error' + (result.errors.length !== 1 ? 's' : '') + '</span>';
      }

      panel.appendChild(stats);

      // Show skip reasons
      if (result.skipReasons && result.skipReasons.length > 0) {
        var skipDiv = document.createElement('div');
        skipDiv.className = 'results-skip-reasons';
        result.skipReasons.forEach(function(r) {
          var reason = document.createElement('div');
          reason.className = 'skip-reason';
          reason.textContent = r;
          skipDiv.appendChild(reason);
        });
        panel.appendChild(skipDiv);
      }

      // Show error details
      if (result.errors && result.errors.length > 0) {
        var errDiv = document.createElement('div');
        errDiv.className = 'results-errors';
        var errUl = document.createElement('ul');
        result.errors.forEach(function(e) {
          var li = document.createElement('li');
          li.textContent = e;
          errUl.appendChild(li);
        });
        errDiv.appendChild(errUl);
        panel.appendChild(errDiv);
      }

      // "View proof" link for Prove It actions
      if (appliedActions) {
        var proofSheet = appliedActions.find(function(a) {
          return a.type === 'add_sheet' && a.sheetName && a.sheetName.indexOf('Proof: ') === 0;
        });
        if (proofSheet) {
          var link = document.createElement('div');
          link.className = 'proof-link';
          link.textContent = 'View proof: ' + proofSheet.sheetName;
          link.onclick = function() {
            google.script.run.navigateToCell(proofSheet.sheetName, 'A1');
          };
          panel.appendChild(link);
        }
      }

      container.appendChild(panel);
      scrollToBottom();
    }

    // ─── Formula X-Ray Renderer ────────────────────────────────────────

    /**
     * Render a Formula X-Ray card in the chat area.
     */
    function renderFormulaXray(xray) {
      var container = document.getElementById('messages');
      var card = document.createElement('div');
      card.className = 'xray-card';

      // Header: cell badge + computed value
      var header = document.createElement('div');
      header.className = 'xray-header';
      var cellRef = (xray.sheet || '') + '!' + (xray.cell || '?');
      header.innerHTML = '<span class="xray-cell-badge">' + escapeHtml(cellRef) + '</span>';
      if (xray.computed_value !== null && xray.computed_value !== undefined) {
        header.innerHTML += ' <span class="xray-computed">= ' + escapeHtml(String(xray.computed_value)) + '</span>';
      }
      card.appendChild(header);

      // Formula bar
      if (xray.raw_formula) {
        var bar = document.createElement('div');
        bar.className = 'xray-formula-bar';
        bar.textContent = xray.raw_formula;
        card.appendChild(bar);
      }

      // Summary
      if (xray.summary) {
        var summaryDiv = document.createElement('div');
        summaryDiv.className = 'xray-summary';
        summaryDiv.textContent = xray.summary;
        card.appendChild(summaryDiv);
      }

      // Components breakdown
      if (xray.components && xray.components.length > 0) {
        var compSection = document.createElement('div');
        compSection.className = 'xray-section';
        compSection.innerHTML = '<div class="xray-section-title">Breakdown</div>';

        xray.components.forEach(function(comp) {
          var row = document.createElement('div');
          row.className = 'xray-component';

          var role = comp.role || 'math';
          row.innerHTML =
            '<span class="xray-role-tag ' + escapeHtml(role) + '">' + escapeHtml(role) + '</span>' +
            '<div><div class="xray-fragment">' + escapeHtml(comp.fragment || '') + '</div>' +
            '<div class="xray-explanation">' + escapeHtml(comp.explanation || '') + '</div></div>';

          compSection.appendChild(row);
        });

        card.appendChild(compSection);
      }

      // Inputs
      if (xray.inputs && xray.inputs.length > 0) {
        var inputSection = document.createElement('div');
        inputSection.className = 'xray-section';
        inputSection.innerHTML = '<div class="xray-section-title">Referenced Cells</div>';

        xray.inputs.forEach(function(input) {
          var row = document.createElement('div');
          row.className = 'xray-input-row';

          var isCrossref = input.sheet && xray.sheet && input.sheet !== xray.sheet;
          var cellClass = isCrossref ? 'crossref' : 'local';
          var cellDisplay = input.sheet ? input.sheet + '!' + input.cell : input.cell;

          row.innerHTML =
            '<span class="xray-input-cell ' + cellClass + '">' + escapeHtml(cellDisplay) + '</span>' +
            '<span class="xray-input-label">' + escapeHtml(input.label || '') + '</span>' +
            '<span class="xray-input-value">' + escapeHtml(String(input.value != null ? input.value : '')) + '</span>';

          inputSection.appendChild(row);
        });

        card.appendChild(inputSection);
      }

      // Tip
      if (xray.tip) {
        var tipDiv = document.createElement('div');
        tipDiv.className = 'xray-tip';
        tipDiv.textContent = xray.tip;
        card.appendChild(tipDiv);
      }

      container.appendChild(card);
      scrollToBottom();
    }

    /**
     * Get the text content of the last assistant message in the chat.
     * Used for "Prove It" context injection.
     */
    function getLastAssistantText() {
      var messages = document.querySelectorAll('.message.assistant');
      if (messages.length === 0) return null;
      var last = messages[messages.length - 1];
      // Prefer raw streamed text (preserves full response including JSON)
      var text = last.dataset.rawText || (last.textContent || last.innerText || '').trim();
      text = text.replace(/```json[\s\S]*?```/g, '').trim();
      if (text.length > 3000) text = text.substring(0, 3000) + '... [truncated]';
      return text || null;
    }

    // ─── Cell Navigation ─────────────────────────────────────────────────

    /**
     * Navigate to a cell reference when clicked in chat.
     */
    function navigateToCellRef(el) {
      var sheet = el.dataset.sheet || '';
      var cell = el.dataset.cell || '';
      if (cell) {
        google.script.run.navigateToCell(sheet, cell);
      }
    }

    // ─── Utility ────────────────────────────────────────────────────────

    function setLoading(on) {
      var btn = document.getElementById('sendBtn');
      btn.disabled = on;
      btn.innerHTML = on ? '<span class="spinner"></span>Thinking...' : 'Send';
    }

    function scrollToBottom() {
      var container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    /**
     * Format an action type for display (e.g., "set_value" → "value").
     */
    function formatActionType(type) {
      var map = {
        'set_value': 'value',
        'set_formula': 'formula',
        'format_cell': 'format',
        'add_sheet': 'sheet',
        'rename_sheet': 'rename',
        'add_named_range': 'range',
        'activate_sheet': 'activate',
        'set_column_width': 'width',
        'freeze_rows': 'freeze',
        'format_range': 'format',
        'set_border': 'border',
        'auto_resize_columns': 'resize',
        'delete_sheet': 'delete',
        'set_tab_color': 'tab color',
        'add_note': 'note',
        'move_sheet': 'move'
      };
      return map[type] || type;
    }

    /**
     * Build a short description of an action locally (no server call needed).
     */
    function describeActionLocally(action) {
      switch (action.type) {
        case 'set_value':
          var val = String(action.value || '');
          if (val.length > 25) val = val.substring(0, 24) + '…';
          return action.cell + ' = "' + val + '" on ' + action.sheet;

        case 'set_formula':
          var formula = action.formula || '';
          if (formula.length > 35) formula = formula.substring(0, 34) + '…';
          return action.cell + ' = ' + formula + ' on ' + action.sheet;

        case 'format_cell':
          var parts = [];
          var fmt = action.format || {};
          if (fmt.fontColor) parts.push(fmt.fontColor);
          if (fmt.bold) parts.push('bold');
          if (fmt.numberFormat) parts.push(fmt.numberFormat);
          if (fmt.background || fmt.backgroundColor) parts.push('bg:' + (fmt.background || fmt.backgroundColor));
          return action.cell + ' on ' + action.sheet + ' → ' + (parts.join(', ') || 'formatting');

        case 'add_sheet':
          return 'Create sheet "' + action.sheetName + '"';

        case 'rename_sheet':
          return '"' + action.sheet + '" → "' + action.sheetName + '"';

        case 'add_named_range':
          return '"' + action.rangeName + '" → ' + action.rangeA1;

        case 'activate_sheet':
          return 'Switch to "' + action.sheet + '"';

        case 'set_column_width':
          return 'Column ' + action.column + ' → ' + action.width + 'px on ' + action.sheet;

        case 'freeze_rows':
          return 'Freeze ' + action.rows + ' row' + (action.rows !== 1 ? 's' : '') + ' on ' + action.sheet;

        case 'format_range':
          var fParts = [];
          var fFmt = action.format || {};
          if (fFmt.fontColor) fParts.push(fFmt.fontColor);
          if (fFmt.bold) fParts.push('bold');
          if (fFmt.italic) fParts.push('italic');
          if (fFmt.numberFormat) fParts.push(fFmt.numberFormat);
          if (fFmt.background || fFmt.backgroundColor) fParts.push('bg:' + (fFmt.background || fFmt.backgroundColor));
          if (fFmt.verticalAlignment) fParts.push('vAlign:' + fFmt.verticalAlignment);
          if (fFmt.horizontalAlignment) fParts.push('hAlign:' + fFmt.horizontalAlignment);
          if (fFmt.wrapStrategy) fParts.push('wrap:' + fFmt.wrapStrategy);
          return action.range + ' on ' + action.sheet + ' \u2192 ' + (fParts.join(', ') || 'formatting');

        case 'set_border':
          var bSides = [];
          if (action.top) bSides.push('top');
          if (action.bottom) bSides.push('bottom');
          if (action.left) bSides.push('left');
          if (action.right) bSides.push('right');
          return action.range + ' on ' + action.sheet + ' \u2192 border (' + (bSides.join(', ') || 'all') + ')';

        case 'auto_resize_columns':
          return 'Columns ' + action.startColumn + '\u2013' + action.endColumn + ' on ' + action.sheet;

        case 'delete_sheet':
          return 'Delete sheet "' + action.sheet + '"';

        case 'set_tab_color':
          return '"' + action.sheet + '" \u2192 ' + action.color;

        case 'add_note':
          var noteText = action.note || '';
          if (noteText.length > 25) noteText = noteText.substring(0, 24) + '\u2026';
          return action.cell + ' on ' + action.sheet + ': "' + noteText + '"';

        case 'move_sheet':
          return '"' + action.sheet + '" \u2192 position ' + action.position;

        default:
          return JSON.stringify(action);
      }
    }

    /**
     * Escape HTML entities to prevent XSS in rendered content.
     */
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ─── Window Toggle ────────────────────────────────────────────────────

    /**
     * Toggle between sidebar and standalone browser window.
     * Expand: opens a real Chrome window via the deployed web app URL.
     * Collapse: saves chat state and closes the window.
     */
    function toggleView() {
      if (isDialogMode) {
        // Dialog → sidebar: save state, open sidebar, close dialog
        saveChatState(function() {
          google.script.run
            .withSuccessHandler(function() { google.script.host.close(); })
            .showSidebar();
        });
      } else {
        // Sidebar → dialog: save state, open dialog, close sidebar
        saveChatState(function() {
          google.script.run
            .withSuccessHandler(function() { google.script.host.close(); })
            .openExpandedView();
        });
      }
    }

    /**
     * Serialize visible chat messages to UserProperties for state transfer.
     * Truncation guard: UserProperties has a 9KB per-property limit.
     * Drops oldest messages until under 8KB (leaves headroom).
     */
    function saveChatState(onDone) {
      var container = document.getElementById('messages');
      var children = container.children;
      var state = [];
      for (var i = 0; i < children.length; i++) {
        state.push(children[i].outerHTML);
      }
      // Truncation guard: drop oldest messages until under 8KB
      var json = JSON.stringify(state);
      while (json.length > 8000 && state.length > 1) {
        state.shift();
        json = JSON.stringify(state);
      }
      var runner = google.script.run;
      if (onDone) runner = runner.withSuccessHandler(onDone);
      runner.saveChatHistory(json);
    }

    /**
     * Restore chat messages from UserProperties (e.g., after expanding to dialog).
     */
    function restoreChatState() {
      google.script.run
        .withSuccessHandler(function(stateJson) {
          if (!stateJson) return;
          try {
            var state = JSON.parse(stateJson);
            if (!state.length) return;
            var container = document.getElementById('messages');
            container.innerHTML = state.join('');
            scrollToBottom();
            google.script.run.saveChatHistory('');
          } catch(e) {
            // Ignore corrupted state
          }
        })
        .loadChatHistory();
    }

    // ─── Onboarding ───────────────────────────────────────────────────────

    /**
     * Check if user has completed onboarding; show card if not.
     */
    function checkOnboarding() {
      google.script.run
        .withSuccessHandler(function(role) {
          if (!role) {
            document.getElementById('onboardingCard').style.display = 'block';
          }
        })
        .getUserRole();
    }

    /**
     * Save selected role, hide card, show welcome message.
     */
    function completeOnboarding() {
      var selected = document.querySelector('input[name="userRole"]:checked');
      if (!selected) return;
      var role = selected.value;
      google.script.run.saveUserRole(role);
      document.getElementById('onboardingCard').style.display = 'none';
      var roleLabels = {
        builder: "Builder mode — I'll give you direct, technical feedback.",
        reviewer: "Reviewer mode — I'll focus on flagging risks and inconsistencies.",
        inherited: "Got it — I'll help you understand what the previous owner built.",
        exploring: "Let's take a look around. Ask me anything about this workbook."
      };
      addMessage(roleLabels[role] || "Let's get started.", 'assistant');
    }
  </script>
