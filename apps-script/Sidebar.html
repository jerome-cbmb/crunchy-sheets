<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #f8f9fa;
      padding: 16px;
    }

    .header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #dadce0;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
      color: #1a73e8;
    }

    .header .subtitle {
      font-size: 11px;
      color: #5f6368;
      margin-top: 4px;
    }

    .user-info {
      font-size: 11px;
      color: #5f6368;
      text-align: center;
      margin-bottom: 16px;
      padding: 8px;
      background: #e8f0fe;
      border-radius: 8px;
    }

    /* Chat area */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 240px);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .message {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 90%;
      word-wrap: break-word;
    }

    .message.user {
      background: #1a73e8;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: white;
      border: 1px solid #dadce0;
      border-bottom-left-radius: 4px;
    }

    .message.system {
      background: #fef7e0;
      border: 1px solid #fdd835;
      font-size: 11px;
      text-align: center;
      max-width: 100%;
    }

    /* ─── Actions Preview Panel ─────────────────────────────── */
    .actions-panel {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      margin-bottom: 8px;
      overflow: hidden;
      max-width: 100%;
    }

    .actions-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #e8f0fe;
      font-weight: 500;
      color: #1a73e8;
      font-size: 12px;
    }

    .actions-header .count-badge {
      display: inline-block;
      background: #1a73e8;
      color: white;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .actions-list {
      max-height: 180px;
      overflow-y: auto;
      padding: 8px 0;
    }

    .actions-list .action-item {
      padding: 5px 14px;
      font-size: 11px;
      color: #3c4043;
      line-height: 1.4;
      border-bottom: 1px solid #f1f3f4;
    }

    .actions-list .action-item:last-child {
      border-bottom: none;
    }

    .action-type-tag {
      display: inline-block;
      background: #f1f3f4;
      color: #5f6368;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 500;
      margin-right: 4px;
      text-transform: uppercase;
    }

    .actions-buttons {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #dadce0;
    }

    .btn-apply {
      flex: 1;
      padding: 8px 16px;
      background: #1e8e3e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-apply:hover { background: #188038; }
    .btn-apply:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }

    .btn-cancel {
      padding: 8px 16px;
      background: white;
      color: #5f6368;
      border: 1px solid #dadce0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .btn-cancel:hover { background: #f8f9fa; }

    /* ─── Parse Warnings ────────────────────────────────────── */
    .parse-warnings {
      background: #fff8e1;
      border: 1px solid #ffcc80;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 11px;
      color: #e65100;
      max-width: 100%;
    }

    .parse-warnings .warning-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .parse-warnings ul {
      margin: 0;
      padding-left: 16px;
    }

    /* ─── Results Summary ───────────────────────────────────── */
    .results-panel {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      max-width: 100%;
    }

    .results-panel .results-title {
      font-weight: 500;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .results-stat {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    .results-stat.applied { background: #e6f4ea; color: #1e8e3e; }
    .results-stat.skipped { background: #fef7e0; color: #e37400; }
    .results-stat.errors  { background: #fce8e6; color: #d93025; }

    .results-errors {
      margin-top: 8px;
      font-size: 11px;
      color: #d93025;
    }

    .results-errors ul {
      margin: 4px 0 0 16px;
      padding: 0;
    }

    /* Input area */
    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #dadce0;
    }

    .input-area textarea {
      flex: 1;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
    }

    .input-area textarea:focus {
      border-color: #1a73e8;
    }

    .input-area button {
      padding: 10px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .input-area button:hover { background: #1557b0; }
    .input-area button:disabled {
      background: #dadce0;
      cursor: not-allowed;
    }

    /* Skill selector */
    .skill-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0;
      margin-bottom: 8px;
    }

    .skill-chip {
      display: inline-block;
      padding: 4px 10px;
      background: white;
      border: 1px solid #dadce0;
      border-radius: 16px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      color: #5f6368;
      transition: all 0.15s;
    }

    .skill-chip:hover { border-color: #1a73e8; color: #1a73e8; }
    .skill-chip.active {
      background: #e8f0fe;
      border-color: #1a73e8;
      color: #1a73e8;
    }

    .loading { opacity: 0.6; pointer-events: none; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #dadce0;
      border-top: 2px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    .spinner.green {
      border-top-color: #1e8e3e;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>🥜 Crunchy Sheets</h1>
    <div class="subtitle">AI CFO for Google Sheets</div>
  </div>

  <div class="user-info" id="userInfo">Connecting...</div>

  <!-- Skill chips -->
  <div class="skill-bar" id="skillBar"></div>

  <!-- Chat -->
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message system">
        Ask me anything about your workbook — or pick a skill above.
      </div>
    </div>

    <div class="input-area">
      <textarea id="prompt" rows="2" placeholder="What would you like to analyze?" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    // ─── State ──────────────────────────────────────────────────────────
    var selectedSkill = null;
    var pendingActions = null; // Actions awaiting user confirmation

    // ─── Init ───────────────────────────────────────────────────────────
    (function init() {
      // Load user info
      google.script.run
        .withSuccessHandler(function(status) {
          var el = document.getElementById('userInfo');
          if (status && status.authorized) {
            el.textContent = '✓ Signed in as ' + status.email;
          } else {
            el.textContent = '⚠ Not authorized — please re-open the add-on.';
          }
        })
        .withFailureHandler(function() {
          document.getElementById('userInfo').textContent = '⚠ Could not check auth status.';
        })
        .checkAuthStatus();

      // Load skill chips
      google.script.run
        .withSuccessHandler(function(skills) {
          var bar = document.getElementById('skillBar');
          skills.forEach(function(skill) {
            var chip = document.createElement('div');
            chip.className = 'skill-chip';
            chip.textContent = skill.name;
            chip.dataset.id = skill.id;
            chip.onclick = function() {
              document.querySelectorAll('.skill-chip').forEach(function(c) { c.classList.remove('active'); });
              if (selectedSkill === skill.id) {
                selectedSkill = null;
              } else {
                chip.classList.add('active');
                selectedSkill = skill.id;
              }
            };
            bar.appendChild(chip);
          });
        })
        .getSkillRegistry();
    })();

    // ─── Chat ───────────────────────────────────────────────────────────
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    function send() {
      var input = document.getElementById('prompt');
      var text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      setLoading(true);

      // Prepend skill hint if selected
      var fullPrompt = text;
      if (selectedSkill) {
        fullPrompt = '[skill:' + selectedSkill + '] ' + text;
      }

      google.script.run
        .withSuccessHandler(handleAnalyzeResult)
        .withFailureHandler(function(err) {
          setLoading(false);
          addMessage('⚠ Error: ' + err.message, 'system');
        })
        .analyzeWorkbook(fullPrompt);
    }

    /**
     * Handle the result from analyzeWorkbook.
     * Shows the AI response, parse warnings, and action preview panel.
     */
    function handleAnalyzeResult(result) {
      setLoading(false);

      if (!result) {
        addMessage('No response received.', 'system');
        return;
      }

      if (result.error) {
        addMessage('⚠ ' + result.error, 'system');
        return;
      }

      // Show the AI's text response
      if (result.response) {
        addMessage(result.response, 'assistant');
      }

      // Show parse warnings if any
      if (result.parseErrors && result.parseErrors.length > 0) {
        addParseWarnings(result.parseErrors);
      }

      // Show action preview panel if actions exist
      if (result.actions && result.actions.length > 0) {
        pendingActions = result.actions;
        addActionsPanel(result.actions);
      }
    }

    // ─── Message Rendering ──────────────────────────────────────────────

    function addMessage(text, role) {
      var container = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'message ' + role;
      div.textContent = text;
      container.appendChild(div);
      scrollToBottom();
    }

    /**
     * Render parse warnings from the backend.
     */
    function addParseWarnings(warnings) {
      var container = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'parse-warnings';

      var title = document.createElement('div');
      title.className = 'warning-title';
      title.textContent = '⚠ Parse warnings (' + warnings.length + ')';
      div.appendChild(title);

      var ul = document.createElement('ul');
      warnings.forEach(function(w) {
        var li = document.createElement('li');
        li.textContent = w;
        ul.appendChild(li);
      });
      div.appendChild(ul);

      container.appendChild(div);
      scrollToBottom();
    }

    /**
     * Render the actions preview panel with Apply/Cancel buttons.
     */
    function addActionsPanel(actions) {
      var container = document.getElementById('messages');
      var panel = document.createElement('div');
      panel.className = 'actions-panel';
      panel.id = 'actionsPanelActive';

      // Header
      var header = document.createElement('div');
      header.className = 'actions-header';
      header.innerHTML = '🔧 Claude wants to make <span class="count-badge">' + actions.length + '</span> change' + (actions.length !== 1 ? 's' : '');
      panel.appendChild(header);

      // Action list (get descriptions from server, or build locally)
      var list = document.createElement('div');
      list.className = 'actions-list';

      actions.forEach(function(action) {
        var item = document.createElement('div');
        item.className = 'action-item';
        item.innerHTML = '<span class="action-type-tag">' + escapeHtml(formatActionType(action.type)) + '</span> ' + escapeHtml(describeActionLocally(action));
        list.appendChild(item);
      });

      panel.appendChild(list);

      // Buttons
      var btnRow = document.createElement('div');
      btnRow.className = 'actions-buttons';

      var applyBtn = document.createElement('button');
      applyBtn.className = 'btn-apply';
      applyBtn.id = 'applyBtn';
      applyBtn.textContent = 'Apply All';
      applyBtn.onclick = function() { applyAllActions(); };

      var cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = function() { cancelActions(panel); };

      btnRow.appendChild(applyBtn);
      btnRow.appendChild(cancelBtn);
      panel.appendChild(btnRow);

      container.appendChild(panel);
      scrollToBottom();
    }

    // ─── Action Execution ───────────────────────────────────────────────

    /**
     * Apply all pending actions via google.script.run.applyActions().
     */
    function applyAllActions() {
      if (!pendingActions || pendingActions.length === 0) return;

      var applyBtn = document.getElementById('applyBtn');
      if (applyBtn) {
        applyBtn.disabled = true;
        applyBtn.innerHTML = '<span class="spinner green"></span>Applying...';
      }

      var actionsToApply = pendingActions;
      pendingActions = null;

      google.script.run
        .withSuccessHandler(function(result) {
          // Remove the active panel
          var panel = document.getElementById('actionsPanelActive');
          if (panel) panel.remove();

          // Show results
          addResultsPanel(result);
        })
        .withFailureHandler(function(err) {
          var panel = document.getElementById('actionsPanelActive');
          if (panel) panel.remove();

          addMessage('⚠ Error applying actions: ' + err.message, 'system');
        })
        .applyActions(actionsToApply);
    }

    /**
     * Cancel pending actions — remove the panel and discard.
     */
    function cancelActions(panel) {
      pendingActions = null;
      if (panel) panel.remove();
      addMessage('Changes cancelled.', 'system');
    }

    /**
     * Render the results panel after actions are applied.
     */
    function addResultsPanel(result) {
      var container = document.getElementById('messages');
      var panel = document.createElement('div');
      panel.className = 'results-panel';

      var title = document.createElement('div');
      title.className = 'results-title';
      title.textContent = '✅ Changes Applied';
      panel.appendChild(title);

      var stats = document.createElement('div');

      if (result.applied > 0) {
        stats.innerHTML += '<span class="results-stat applied">✓ ' + result.applied + ' applied</span>';
      }
      if (result.skipped > 0) {
        stats.innerHTML += '<span class="results-stat skipped">⊘ ' + result.skipped + ' skipped</span>';
      }
      if (result.errors && result.errors.length > 0) {
        stats.innerHTML += '<span class="results-stat errors">✗ ' + result.errors.length + ' error' + (result.errors.length !== 1 ? 's' : '') + '</span>';
      }

      panel.appendChild(stats);

      // Show error details
      if (result.errors && result.errors.length > 0) {
        var errDiv = document.createElement('div');
        errDiv.className = 'results-errors';
        var errUl = document.createElement('ul');
        result.errors.forEach(function(e) {
          var li = document.createElement('li');
          li.textContent = e;
          errUl.appendChild(li);
        });
        errDiv.appendChild(errUl);
        panel.appendChild(errDiv);
      }

      container.appendChild(panel);
      scrollToBottom();
    }

    // ─── Utility ────────────────────────────────────────────────────────

    function setLoading(on) {
      var btn = document.getElementById('sendBtn');
      btn.disabled = on;
      btn.innerHTML = on ? '<span class="spinner"></span>Thinking...' : 'Send';
    }

    function scrollToBottom() {
      var container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    /**
     * Format an action type for display (e.g., "set_value" → "value").
     */
    function formatActionType(type) {
      var map = {
        'set_value': 'value',
        'set_formula': 'formula',
        'format_cell': 'format',
        'add_sheet': 'sheet',
        'rename_sheet': 'rename',
        'add_named_range': 'range'
      };
      return map[type] || type;
    }

    /**
     * Build a short description of an action locally (no server call needed).
     */
    function describeActionLocally(action) {
      switch (action.type) {
        case 'set_value':
          var val = String(action.value || '');
          if (val.length > 25) val = val.substring(0, 24) + '…';
          return action.cell + ' = "' + val + '" on ' + action.sheet;

        case 'set_formula':
          var formula = action.formula || '';
          if (formula.length > 35) formula = formula.substring(0, 34) + '…';
          return action.cell + ' = ' + formula + ' on ' + action.sheet;

        case 'format_cell':
          var parts = [];
          var fmt = action.format || {};
          if (fmt.fontColor) parts.push(fmt.fontColor);
          if (fmt.bold) parts.push('bold');
          if (fmt.numberFormat) parts.push(fmt.numberFormat);
          if (fmt.background || fmt.backgroundColor) parts.push('bg:' + (fmt.background || fmt.backgroundColor));
          return action.cell + ' on ' + action.sheet + ' → ' + (parts.join(', ') || 'formatting');

        case 'add_sheet':
          return 'Create sheet "' + action.sheetName + '"';

        case 'rename_sheet':
          return '"' + action.sheet + '" → "' + action.sheetName + '"';

        case 'add_named_range':
          return '"' + action.rangeName + '" → ' + action.rangeA1;

        default:
          return JSON.stringify(action);
      }
    }

    /**
     * Escape HTML entities to prevent XSS in rendered content.
     */
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }
  </script>

</body>
</html>
